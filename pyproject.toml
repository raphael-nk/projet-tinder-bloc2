[project]
name = "projet-tinder-bloc2"
version = "0.1.0"
description = "EDA et data storytelling sur le Speed Dating Dataset — Plotly interactif (Bloc 2 CDSD)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaleido>=1.2.0",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "ruff>=0.11",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]
